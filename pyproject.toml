[project]
name = "zerogravity"
version = "0.1.0"
description = "ZeroGravity (0g) - Gemini Web driven autonomous code generation pipeline"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["workspace", "data", ".venv", "**/.venv"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, bugbear
select = ["E", "F", "W", "B"]
# E501: long prompt templates / regexes are intentional
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/router/tests/*" = ["B"]

# ---------------------------------------------------------------------------
# Bandit (security)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["services/router/tests", "tests", "workspace", ".venv"]

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

